<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A simple todo list that saves your tasks in the browser." />
  <title>Todo List</title>
  <link rel="stylesheet" href="css/apps.css" />
</head>
<body>
  <header class="site-header">
    <span class="site-header__brand">My Website</span>
    <nav class="site-nav" aria-label="Main">
      <a class="site-nav__link" href="index.html">Home</a>
      <a class="site-nav__link" href="weather.html">Weather</a>
      <a class="site-nav__link site-nav__link--active" href="todo.html" aria-current="page">Todo</a>
    </nav>
  </header>

  <main class="page">
    <h1 class="page__title">Todo list</h1>
    <p class="page__intro">Your tasks are saved in this browser.</p>

    <section class="card">
      <form id="todo-form" class="form-row">
        <input id="todo-input" class="input" type="text" placeholder="Add a task" aria-label="New task" autocomplete="off" required />
        <button class="btn" type="submit">Add task</button>
      </form>

      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="btn btn--ghost" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="btn btn--ghost" type="button" data-filter="active" aria-pressed="false">Active</button>
        <button class="btn btn--ghost" type="button" data-filter="completed" aria-pressed="false">Completed</button>
      </div>

      <ul id="todo-list" class="todo__list"></ul>
      <p id="todo-empty" class="todo__empty" hidden></p>

      <div class="todo__footer">
        <span id="todo-count" aria-live="polite"></span>
        <button id="clear-completed" class="btn btn--ghost" type="button">Clear completed</button>
      </div>
    </section>
  </main>

  <script src="js/todo.js"></script>
</body>
</html>
